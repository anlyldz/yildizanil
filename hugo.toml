baseURL = 'https://yildizanil.com/'
theme = "mana"
defaultContentLanguage = "tr"
languageCode = "tr-TR"
title = "Anıl Yıldız"

[pagination]
  pageSize = 10

[markup]
  [markup.tableOfContents]
    startLevel = 1
    endLevel = 6
    ordered = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = true
        title = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    noClasses = false
    style = "catppuccin-macchiato"

[outputs]
  home = ["HTML", "JSON"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[params]
  enableIntegrity = false
  relatedPostsCount = 3
  description = "Cyber Security Engineer | SIEM & Threat Detection"
  author = "Anıl Yıldız"
  heroTitleLine1 = "ANIL YILDIZ"
  heroTitleLine2 = "Cyber Security Engineer"
  footerText = ""

  [params.avatar]
    assetPath = "images/avatar-astronaut.png"

    [params.avatar.home]
      assetPath = "images/avatar-astronaut.png"

    [params.avatar.about]
      assetPath = "images/avatar-astronaut.png"

  [params.social]
    linkedin = "https://linkedin.com/in/anil-yildiz-"
    email = "uaanlyldz@gmail.com"

  [params.buyMeACoffee]
    enabled = false

  [params.codeHighlight]
    darkTheme = "catppuccin-macchiato"
    lightTheme = "catppuccin-frappe"

  [params.copyright]
    startYear = 2026
    endYear = 2026
    owner = "Anıl Yıldız"

  [params.admonitions]
    alertStyle = "favicon"

[[menus.main]]
  name = "Ana Sayfa"
  pageRef = "/"
  weight = 10

[[menus.main]]
  name = "Yazılar"
  pageRef = "/posts"
  weight = 20

[[menus.main]]
  name = "Etiketler"
  pageRef = "/tags"
  weight = 30

[[menus.main]]
  name = "Hakkımda"
  url = "/about/"
  weight = 40
