<div class="post-share">
  <span class="post-share-label">Paylaş</span>
  <a class="post-share-btn" href="https://twitter.com/intent/tweet?url={{ .Permalink }}&text={{ .Title }}" target="_blank" rel="noopener" aria-label="X'te paylaş" title="X">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M18.244 1.803h8.155a1.719 1.719 0 0 1 .002 0l.162 2.949a1.653 1.653 0 0 1 .226-.198l3.952 5.585a1.653 1.653 0 0 0 .17 .978l-.64 2.29a4.138 4.138 0 0 1 .834-1.812 8.62zM8.79 2.633l2.38 6.237"/></svg>
  </a>
  <a class="post-share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ .Permalink }}" target="_blank" rel="noopener" aria-label="LinkedIn'de paylaş" title="LinkedIn">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.447 14.105l-.98-1.579l1.51-.982l-4.073.067l-1.746 2.235l4.434-1.078l-3.197 2.712l2.515 3.444l-1.119-1.063l1.119.057"/></svg>
  </a>
  <a class="post-share-btn" href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink }}" target="_blank" rel="noopener" aria-label="Facebook'ta paylaş" title="Facebook">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M22 2l-2.5-1.5h-3.5v2.5h4.5v6.5h-4.5v2.5h-3.5v-5.5h8.5v8.5h-4.5v-2.5h-4.5"/></svg>
  </a>
  <a class="post-share-btn" href="https://wa.me/?text={{ .Title }} {{ .Permalink }}" target="_blank" rel="noopener" aria-label="WhatsApp ile paylaş" title="WhatsApp">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 8h14v2h-2v6h2v-2h-4v5h2v-5h10v2h-8v1h3v2h-2v-4h4v4h-3v1h3zM13.1 3.15v-1.9l.5 11.5h-1.1v2.3c-1.1.5-3.2 0v1.9zM20.1 9.15l-.9 5.5h-1.2v-1.2l-.4-4.1v3.3z"/></svg>
  </a>
  <button type="button" class="post-share-btn post-share-copy" data-copy-url="{{ .Permalink }}" aria-label="Linki kopyala" title="Bağlantıyı kopyala">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 6l.007 0a1.55 1.55 0 0 1 .255.845l4.772 2.176a1.26 1.26 0 0 1 .22.883l-1.588.223a1.19 1.19 0 0 0 .53.908l-3.576.263a1.18 1.18 0 0 1 .561.918l-4.135.263a1.19 1.19 0 0 0 .553.941l4.82.906zM6 6.002a1 1 0 0 0 .866.5l5.262-3.085a1 1 0 0 1 1.136.044l-3.14.5M6.3 7.5l.983 1.433l-4.707-.333"/></svg>
  </button>
  <span class="post-share-copied">{{ i18n "copied" | default "Kopyalandı!" }}</span>
</div>

<script>
(function () {
  var copyBtn = document.querySelector(".post-share-copy");
  if (!copyBtn) return;
  copyBtn.addEventListener("click", async function () {
    var url = copyBtn.getAttribute("data-copy-url");
    try {
      await navigator.clipboard.writeText(location.origin + url);
    } catch (e) {
      var ta = document.createElement("textarea");
      ta.value = location.origin + url;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    var msg = document.querySelector(".post-share-copied");
    if (msg) {
      msg.classList.add("visible");
      setTimeout(function () { msg.classList.remove("visible"); }, 2000);
    }
  });
})();
</script>
