{{ $url := .Permalink }}
<div class="post-share">
  <span class="post-share-label">Paylaş</span>
  <a class="post-share-btn" href="https://twitter.com/intent/tweet?url={{ $url }}" target="_blank" rel="noopener" aria-label="X'te paylaş" title="X">
    <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><text x="12" y="17" text-anchor="middle" font-size="17" font-weight="bold">X</text></svg>
  </a>
  <a class="post-share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url={{ $url }}" target="_blank" rel="noopener" aria-label="LinkedIn'de paylaş" title="LinkedIn">
    <svg class="share-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><text x="12" y="16" text-anchor="middle" font-size="14" font-weight="bold">in</text></svg>
  </a>
  <button type="button" class="post-share-btn post-share-copy" data-copy-url="{{ $url }}" aria-label="Linki kopyala" title="Bağlantıyı kopyala">
    <svg class="share-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="7" y="5" width="10" height="12" rx="2" fill="none"/><rect x="7" y="5" width="3" height="12" fill="currentColor"/></svg>
  </button>
  <span class="post-share-copied">Kopyalandı!</span>
</div>

<script>
(function () {
  var copyBtn = document.querySelector(".post-share-copy");
  if (!copyBtn) return;
  copyBtn.addEventListener("click", async function () {
    var url = copyBtn.getAttribute("data-copy-url");
    var full = url.indexOf("http") === 0 ? url : location.origin + url;
    try {
      await navigator.clipboard.writeText(full);
    } catch (e) {
      var ta = document.createElement("textarea");
      ta.value = full;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      document.body.removeChild(ta);
    }
    var msg = document.querySelector(".post-share-copied");
    if (msg) {
      msg.classList.add("visible");
      setTimeout(function () { msg.classList.remove("visible"); }, 2000);
    }
  });
})();
</script>
